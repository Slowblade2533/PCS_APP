<div class="drawer lg:drawer-open">
  <input id="main-drawer" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col bg-base-200 min-h-screen relative">
    <div
      class="sticky top-0 z-10 lg:hidden bg-base-100/90 backdrop-blur shadow-sm p-1 px-2 flex items-center gap-2"
    >
      <label for="main-drawer" class="btn btn-ghost btn-square btn-sm drawer-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="size-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </label>
      <span class="font-semibold text-base">เมนูระบบ</span>
    </div>

    <main class="flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div class="drawer-side z-50">
    <label for="main-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <app-dashboard-sidebar></app-dashboard-sidebar>
  </div>
</div>
