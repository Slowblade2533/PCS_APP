<div class="min-h-screen bg-base-300 flex items-center justify-center p-4">
  <div class="card bg-base-100 w-full max-w-md shadow-2xl border border-base-200/50">
    <div class="card-body gap-6">
      <div class="flex flex-col items-center text-center gap-2">
        <div class="avatar placeholder">
          <div class="bg-primary text-primary-content w-12 rounded-xl mask mask-squircle">
            <span class="text-xl font-bold">A</span>
          </div>
        </div>
        <h2 class="card-title text-2xl font-bold tracking-tight">ยินดีต้อนรับกลับมา</h2>
        <p class="text-sm text-base-content/60">กรุณาเข้าสู่ระบบเพื่อใช้งานบัญชีของคุณ</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="form-control">
          <label class="label pt-0">
            <span class="label-text font-medium">อีเมล</span>
          </label>
          <label class="input input-bordered flex items-center gap-2 focus-within:input-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="w-4 h-4 opacity-50"
            >
              <path
                d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 1.5 3h11Z"
              />
              <path
                d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z"
              />
            </svg>
            <input
              type="email"
              formControlName="email"
              class="grow"
              placeholder="your@email.com"
              autocomplete="email"
            />
          </label>
          @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
            <label class="label pb-0 animate-fade-in">
              <span class="label-text-alt text-error text-xs">กรุณากรอกอีเมลที่ถูกต้อง</span>
            </label>
          }
        </div>

        <div class="form-control">
          <label class="label pt-0">
            <span class="label-text font-medium">รหัสผ่าน</span>
          </label>
          <label class="input input-bordered flex items-center gap-2 focus-within:input-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="w-4 h-4 opacity-50"
            >
              <path
                fill-rule="evenodd"
                d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              [type]="isPasswordVisible ? 'text' : 'password'"
              formControlName="password"
              class="grow"
              placeholder="••••••••"
              autocomplete="current-password"
            />

            <button
              type="button"
              class="btn btn-ghost btn-xs btn-circle"
              (click)="togglePasswordVisibility()"
            >
              @if (isPasswordVisible) {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  fill="currentColor"
                  class="w-4 h-4 opacity-50"
                >
                  <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" />
                  <path
                    fill-rule="evenodd"
                    d="M1.38 8.14a10.74 10.74 0 0 1 13.24 0 .75.75 0 0 1 0 1.22 10.74 10.74 0 0 1-13.24 0 .75.75 0 0 1 0-1.22ZM8 13.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Z"
                    clip-rule="evenodd"
                  />
                </svg>
              } @else {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  fill="currentColor"
                  class="w-4 h-4 opacity-50"
                >
                  <path
                    fill-rule="evenodd"
                    d="M8 2c1.98 0 3.86.63 5.4 1.8l-1.15 1.16A7.48 7.48 0 0 0 8 3.5c-3.18 0-6.04 1.98-7.14 4.96a.75.75 0 0 0 0 .48 7.51 7.51 0 0 0 4.19 4.39l-1.3 1.3A9 9 0 0 1 .13 8.68a.75.75 0 0 1 0-.36A9 9 0 0 1 8 2Zm3.48 3.56A3.5 3.5 0 0 1 11.5 8a3.5 3.5 0 0 1-.56 1.92l1.11 1.11A5 5 0 0 0 13 8a5 5 0 0 0-1.52-3.44l-1.11-1.11ZM8 6a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm-4.92.56L1.97 5.45A5 5 0 0 0 1.5 8a5 5 0 0 0 1.52 3.44l1.11-1.11A3.5 3.5 0 0 1 3.5 8c0-.52.11-1 .31-1.44Zm5.1 5.1L6.08 9.58A3.5 3.5 0 0 1 4.5 8c0-.6.15-1.16.42-1.65l-1.3-1.3a5 5 0 0 0-.62 1.31L1.44 7.92a.75.75 0 0 0 0 .16A5.5 5.5 0 0 0 8 13.5c.34 0 .68-.03 1.02-.09l-.84-.85Z"
                    clip-rule="evenodd"
                  />
                </svg>
              }
            </button>
          </label>
        </div>

        <div class="flex items-center justify-between text-sm mt-1">
          <label class="fieldset-label cursor-pointer flex items-center gap-2">
            <input
              type="checkbox"
              formControlName="rememberMe"
              class="checkbox checkbox-primary checkbox-sm"
            />
            <span class="label-text">จดจำฉันไว้</span>
          </label>
          <a href="#" class="link link-primary link-hover font-medium">ลืมรหัสผ่าน?</a>
        </div>

        <div class="form-control mt-4">
          <button
            type="submit"
            [disabled]="loginForm.invalid"
            class="btn btn-primary btn-block text-base font-semibold"
          >
            @if (isLoading()) {
              <span class="loading loading-spinner"></span>
              กำลังเข้าสู่ระบบ...
            } @else {
              เข้าสู่ระบบ
            }
          </button>
        </div>
      </form>

      <div class="divider text-xs text-base-content/40 my-0"></div>
      <div class="text-center text-sm mt-2">
        <span class="text-base-content/60">ยังไม่มีบัญชีใช่ไหม? </span>
        <a href="#" class="link link-primary link-hover font-semibold">สร้างบัญชีใหม่</a>
      </div>
    </div>
  </div>
</div>
