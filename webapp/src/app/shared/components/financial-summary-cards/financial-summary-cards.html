<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
  <!-- Card 1: Income / Budget -->
  <div class="card bg-base-100 shadow-xl border-l-4 border-success hover:-translate-y-0.5 transition-all duration-300">
    <div class="card-body p-5 flex-row justify-between items-center">
      <div class="space-y-1">
        <span class="text-xs uppercase tracking-wider font-semibold text-base-content/60">{{ incomeLabel }}</span>
        <div class="text-2xl font-extrabold text-success font-mono">฿{{ income | number: '1.2-2' }}</div>
        <p class="text-xs text-base-content/40">{{ incomeDesc }}</p>
      </div>
      <div class="p-3 bg-success/10 rounded-xl text-success">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Card 2: Expense / Spent -->
  <div class="card bg-base-100 shadow-xl border-l-4 border-error hover:-translate-y-0.5 transition-all duration-300">
    <div class="card-body p-5 flex-row justify-between items-center">
      <div class="space-y-1">
        <span class="text-xs uppercase tracking-wider font-semibold text-base-content/60">{{ expenseLabel }}</span>
        <div class="text-2xl font-extrabold text-error font-mono">฿{{ expense | number: '1.2-2' }}</div>
        <p class="text-xs text-base-content/40">{{ expenseDesc }}</p>
      </div>
      <div class="p-3 bg-error/10 rounded-xl text-error">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Card 3: Balance / Net -->
  <div class="card bg-base-100 shadow-xl border-l-4 hover:-translate-y-0.5 transition-all duration-300"
       [class.border-success]="balance >= 0"
       [class.border-error]="balance < 0">
    <div class="card-body p-5 flex-row justify-between items-center">
      <div class="space-y-1">
        <span class="text-xs uppercase tracking-wider font-semibold text-base-content/60">{{ balanceLabel }}</span>
        <div class="text-2xl font-extrabold font-mono"
             [class.text-success]="balance >= 0"
             [class.text-error]="balance < 0">
          ฿{{ balance | number: '1.2-2' }}
        </div>
        <p class="text-xs text-base-content/40">{{ balanceDesc }}</p>
      </div>
      <div class="p-3 rounded-xl"
           [class.bg-success/10]="balance >= 0"
           [class.text-success]="balance >= 0"
           [class.bg-error/10]="balance < 0"
           [class.text-error]="balance < 0">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      </div>
    </div>
  </div>
</div>
